[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mnb-veritas"
version = "1.4.0"
description = "Official Python SDK and CLI for MNB Veritas evidence-gated verification middleware"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "MNB Research Veritas Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[project.scripts]
veritas = "veritas.cli:main"
veritas-cli = "veritas.cli:main"
