name: MNB Veritas CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

concurrency:
  group: mnb-veritas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DEFAULT_POLICY_MODE: "strict"
  VERITAS_API_KEY: "veritas-local-dev-key-2026"
  ANTHROPIC_API_KEY: "ci-dummy-anthropic-key"
  OPENAI_API_KEY: "ci-dummy-openai-key"
  GEMINI_API_KEY: "ci-dummy-gemini-key"
  XAI_API_KEY: "ci-dummy-xai-key"
  OLLAMA_BASE_URL: "http://localhost:11434/v1"

jobs:
  backend-tests:
    name: Backend (Python 3.12 + pytest 80/80)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mnb_veritas_ci
          POSTGRES_USER: veritas_ci
          POSTGRES_PASSWORD: veritas_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-asyncio httpx

      - name: Setup PostgreSQL extensions (vector + pg_trgm)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=veritas_ci_password psql -h 127.0.0.1 -U veritas_ci -d mnb_veritas_ci -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run pytest unit & verification test suite (80 tests)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://veritas_ci:veritas_ci_password@127.0.0.1:5432/mnb_veritas_ci
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          pytest tests/ -v

  frontend-checks:
    name: Frontend (TypeScript + Next.js 15 Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm && pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js production bundle
        env:
          VERITAS_API_URL: http://127.0.0.1:8000
          VERITAS_API_KEY: ${{ env.VERITAS_API_KEY }}
        run: npm run build

  docker-build:
    name: Docker Images (Backend & Frontend)
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=mnb-veritas-backend
          cache-to: type=gha,mode=max,scope=mnb-veritas-backend

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=mnb-veritas-frontend
          cache-to: type=gha,mode=max,scope=mnb-veritas-frontend

      - name: Build unified full-stack Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=mnb-veritas-fullstack
          cache-to: type=gha,mode=max,scope=mnb-veritas-fullstack
